name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring,bcmath,pdo,pdo_mysql,tokenizer,xml,ctype,json
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
      
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
      
          chmod 600 ~/.ssh/deploy_key
      
          echo "Checking private key..."
          ssh-keygen -l -f ~/.ssh/deploy_key
      
          echo "Fetching host key..."
          ssh-keyscan -p 65002 -H 82.25.125.167 >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -az \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='storage/logs' \
            --exclude='storage/app/public' \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            ./ \
            u791137564@82.25.125.167:/home/u791137564/domains/meritsphere.in/public_html/gympass

      - name: Post-deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p 65002 \
            -o StrictHostKeyChecking=no \
            u791137564@82.25.125.167 << 'ENDSSH'
          set -e
          cd /home/u791137564/domains/meritsphere.in/public_html/gympass
          php artisan migrate --force
          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
